<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 16px;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    h2 span { color: #888; font-weight: 400; }
    label {
      display: block;
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
      margin-top: 12px;
    }
    label:first-of-type { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 7px 10px;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: #555; }
    select option { background: #2a2a2a; }
    .status {
      margin-top: 14px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
      background: #1e3a2a;
      color: #4ade80;
    }
    .status.show { display: block; }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 8px;
      background: #fff;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.1s;
    }
    button:hover { opacity: 0.85; }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>🌐 Local Translator</h2>
  
  <label>Порт LM Studio</label>
  <input type="number" id="port" placeholder="1234" value="1234">
  
  <label>Язык перевода</label>
  <select id="targetLang">
    <option value="русский">Русский</option>
    <option value="украинский">Украинский</option>
    <option value="английский">Английский</option>
    <option value="немецкий">Немецкий</option>
    <option value="французский">Французский</option>
    <option value="испанский">Испанский</option>
  </select>

  <button id="save">Сохранить</button>
  <div class="status" id="status">✓ Сохранено</div>
  
  <p class="hint">Убедись что в LM Studio включён Local Server (вкладка Local Server → Start)</p>

  <script src="popup.js"></script>
</body>
</html>
